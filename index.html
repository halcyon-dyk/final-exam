<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>지하 시설 탈출</title>
    <style>
      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f3f6fb;
        overscroll-behavior: none;
        padding: var(--safe-top, 0px) var(--safe-right, 0px) var(--safe-bottom, 0px) var(--safe-left, 0px);
      }

      #game-container {
        width: min(calc(100vw - var(--safe-left, 0px) - var(--safe-right, 0px)), 960px);
        height: min(calc(100svh - var(--safe-top, 0px) - var(--safe-bottom, 0px)), 640px);
        background: #fff;
      }

      #game-container canvas {
        display: block;
      }
      #boot-status {
        position: fixed; inset: 0; margin: 0; display: grid; place-items: center;
        background: #111315; color: #d7d2c8; font: 22px sans-serif; z-index: 10;
      }
      #boot-status[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main id="game-container" aria-label="지하 시설 탈출 게임 영역"></main>
    <p id="boot-status" role="status">시설을 불러오는 중…</p>
    <script type="module">
      // SDK import completes before Phaser or any game script executes.
      let sdk = null;
      try {
        const { createSDK } = await import("https://h5sdk.onestore.net/lib/v1.2.0/onestore-h5-sdk.min.js");
        sdk = createSDK();
      } catch (error) {
        console.warn("ONE store SDK unavailable; starting browser mode.", error);
      }
      const { OneStoreBridge } = await import("./js/platform/OneStore.js?v=20261125-onestore");
      window.oneStore = new OneStoreBridge(sdk);
      await window.oneStore.initialize();
      const scripts = [
        "https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js",
        "js/state/Clues.js?v=20261126-migration",
        "js/state/GameState.js?v=20261126-migration",
        "js/audio/AudioManager.js?v=20261125-onestore",
        "js/ui/AudioSettingsPanel.js?v=20261125-onestore",
        "js/ui/Layout.js?v=20261125-onestore",
        "js/ui/InvestigationPanel.js?v=20261126-hints",
        "js/ui/InventoryPanel.js?v=20261125-onestore",
        "js/ui/MemoPanel.js?v=20261126-clues",
        "js/ui/TimerDisplay.js?v=20261125-onestore",
        "js/ui/HintPanel.js?v=20261126-hints",
        "js/ui/Feedback.js?v=20261125-onestore",
        "js/puzzles/CodePuzzle.js?v=20261125-onestore",
        "js/puzzles/WirePuzzle.js?v=20261125-onestore",
        "js/puzzles/SequencePuzzle.js?v=20261125-onestore",
        "js/puzzles/ToolboxPuzzle.js?v=20261125-onestore",
        "js/puzzles/PowerPuzzle.js?v=20261126-power",
        "js/rooms/PrisonRoom.js?v=20261126-clues",
        "js/rooms/MaintenanceRoom.js?v=20261126-hints",
        "js/rooms/ControlRoom.js?v=20261126-migration",
        "js/scenes/StartScene.js?v=20261125-title-bounds",
        "js/scenes/GameScene.js?v=20261126-migration",
        "js/scenes/ResultScene.js?v=20261125-onestore",
        "js/scenes/BootScene.js?v=20261125-onestore",
        "js/main.js?v=20261125-onestore"
];
      try {
        for (const src of scripts) {
          await new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = src;
            script.onload = resolve;
            script.onerror = () => reject(new Error(src));
            document.head.appendChild(script);
          });
        }
      } catch (error) {
        document.getElementById("boot-status").textContent = "게임을 불러오지 못했습니다. 새로고침해 주세요.";
        console.error(error);
      }
    </script>
  </body>
</html>
