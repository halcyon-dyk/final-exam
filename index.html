<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>지하 시설 탈출</title>
    <style>
      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f3f6fb;
      }

      #game-container {
        width: min(100vw, 960px);
        height: min(100svh, 640px);
        background: #fff;
      }

      #game-container canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <main id="game-container" aria-label="지하 시설 탈출 게임 영역"></main>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="js/state/GameState.js"></script>
    <script src="js/audio/AudioManager.js?v=20261125-control"></script>
    <script src="js/ui/Layout.js"></script>
    <script src="js/ui/InvestigationPanel.js"></script>
    <script src="js/ui/InventoryPanel.js"></script>
    <script src="js/ui/MemoPanel.js"></script>
    <script src="js/ui/TimerDisplay.js"></script>
    <script src="js/ui/HintPanel.js"></script>
    <script src="js/ui/Feedback.js?v=20261125-flashlight"></script>
    <script src="js/puzzles/CodePuzzle.js"></script>
    <script src="js/puzzles/WirePuzzle.js"></script>
    <script src="js/puzzles/SequencePuzzle.js"></script>
    <script src="js/rooms/PrisonRoom.js"></script>
    <script src="js/rooms/MaintenanceRoom.js?v=20261125-flashlight"></script>
    <script src="js/rooms/ControlRoom.js?v=20261125-control"></script>
    <script src="js/scenes/StartScene.js?v=20261125-background"></script>
    <script src="js/scenes/GameScene.js?v=20261125-control"></script>
    <script src="js/scenes/ResultScene.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
